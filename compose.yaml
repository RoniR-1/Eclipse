services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: financial_twin
      POSTGRES_USER: financial_twin
      POSTGRES_PASSWORD: financial_twin
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - financial_twin_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial_twin -d financial_twin"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  financial_twin_data:
